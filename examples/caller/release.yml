name: Version & Release

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: 버전 및 배포 작업
        required: true
        type: choice
        default: '[개발] RC · 테스트 버전 업데이트'
        options:
          - '[개발] Major · 대규모 변경 버전 시작'
          - '[개발] Minor · 기능 추가 버전 시작'
          - '[개발] Patch · 버그 수정 버전 시작'
          - '[개발] RC · 테스트 버전 업데이트'
          - '[배포] Stable · 정식 버전 출시'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
    steps:
      - id: resolve
        shell: bash
        env:
          ACTION: ${{ inputs.release_action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            '[개발] Major · 대규모 변경 버전 시작') OPERATION='dev-major' ;;
            '[개발] Minor · 기능 추가 버전 시작') OPERATION='dev-minor' ;;
            '[개발] Patch · 버그 수정 버전 시작') OPERATION='dev-patch' ;;
            '[개발] RC · 테스트 버전 업데이트') OPERATION='dev-rc' ;;
            '[배포] Stable · 정식 버전 출시') OPERATION='release-stable' ;;
            *) echo "::error::알 수 없는 배포 작업: $ACTION"; exit 1 ;;
          esac
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"

  plan:
    needs: resolve
    uses: jejusee/releases/.github/workflows/plan.yml@main
    with:
      project: example-project
      operation: ${{ needs.resolve.outputs.operation }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  package:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build package
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Replace this example with the project's real build/package command.
          tar -czf "dist/example-project-${VERSION}.tar.gz" README.md
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, plan, package]
    uses: jejusee/releases/.github/workflows/publish.yml@main
    with:
      project: example-project
      operation: ${{ needs.resolve.outputs.operation }}
      version: ${{ needs.plan.outputs.version }}
      artifact_name: release-package
      asset_spec: >-
        [{"platform":"any","file":"example-project-${{ needs.plan.outputs.version }}.tar.gz","type":"archive","installer":"lib/install.sh"}]
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
