name: Example Dev Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version action
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: Custom target MAJOR.MINOR.PATCH (used only with custom)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: example-project-release
  cancel-in-progress: false

jobs:
  plan:
    uses: jejusee/releases/.github/workflows/plan.yml@main
    with:
      project: example-project
      operation: dev
      bump: ${{ inputs.bump }}
      target_version: ${{ inputs.custom_version }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  package:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build package
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/example-project-${VERSION}.tar.gz" README.md
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, package]
    uses: jejusee/releases/.github/workflows/publish.yml@main
    with:
      project: example-project
      operation: dev
      bump: ${{ inputs.bump }}
      target_version: ${{ inputs.custom_version }}
      version: ${{ needs.plan.outputs.version }}
      artifact_name: release-package
      asset_spec: >-
        [{"platform":"any","file":"example-project-${{ needs.plan.outputs.version }}.tar.gz","type":"archive","installer":"lib/install.sh"}]
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
