name: Release Hub - Plan

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      operation:
        description: dev, release-stable, or a legacy operation
        required: true
        type: string
      bump:
        description: auto, patch, minor, major, custom
        required: false
        default: auto
        type: string
      target_version:
        description: Explicit base/exact version when required by the strategy
        required: false
        default: ''
        type: string
      target_repository:
        required: false
        default: jejusee/releases
        type: string
    secrets:
      RELEASE_TOKEN:
        required: true
    outputs:
      version:
        value: ${{ jobs.plan.outputs.version }}
      tag:
        value: ${{ jobs.plan.outputs.tag }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.operation }}" in
            dev|release-stable|dev-major|dev-minor|dev-patch|dev-rc) ;;
            *) echo "::error::Invalid operation"; exit 1 ;;
          esac
          case "${{ inputs.bump }}" in
            auto|patch|minor|major|custom) ;;
            *) echo "::error::Invalid bump"; exit 1 ;;
          esac
          [[ "${{ inputs.project }}" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "::error::Invalid project identifier"; exit 1;
          }

      - name: Checkout Release Hub
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: main
          path: release-hub
          fetch-depth: 1

      - name: Calculate next version
        id: plan
        shell: bash
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          ARGS=(
            next
            --project "${{ inputs.project }}"
            --manifest "release-hub/${{ inputs.project }}/manifest.json"
            --operation "${{ inputs.operation }}"
            --bump "${{ inputs.bump }}"
          )
          [[ -z "$TARGET_VERSION" ]] || ARGS+=(--target-version "$TARGET_VERSION")
          VERSION="$(python3 release-hub/scripts/release_hub.py "${ARGS[@]}")"
          TAG="${{ inputs.project }}-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo
            echo "- Project: \`${{ inputs.project }}\`"
            echo "- Operation: \`${{ inputs.operation }}\`"
            echo "- Bump: \`${{ inputs.bump }}\`"
            [[ -z "$TARGET_VERSION" ]] || echo "- Requested: \`$TARGET_VERSION\`"
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
