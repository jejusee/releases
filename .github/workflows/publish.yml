name: Release Hub

on:
  workflow_call:
    inputs:
      project:
        description: Project identifier used for folder and tag prefix
        required: true
        type: string
      operation:
        description: dev, release-stable, or a legacy operation
        required: true
        type: string
      bump:
        description: auto, patch, minor, major, custom
        required: false
        default: auto
        type: string
      target_version:
        description: Explicit base/exact version when required by the strategy
        required: false
        default: ''
        type: string
      version:
        description: Version returned by plan.yml
        required: true
        type: string
      artifact_name:
        description: Workflow artifact containing finished release files
        required: true
        type: string
      asset_spec:
        description: JSON array mapping platform keys to filenames
        required: true
        type: string
      target_repository:
        description: Public distribution repository
        required: false
        default: jejusee/releases
        type: string
    secrets:
      RELEASE_TOKEN:
        required: true
    outputs:
      version:
        description: Published semantic version
        value: ${{ jobs.publish.outputs.version }}
      tag:
        description: Published Git tag
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: read

concurrency:
  group: release-hub-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.operation }}" in
            dev|release-stable|dev-major|dev-minor|dev-patch|dev-rc) ;;
            *) echo "::error::Invalid operation"; exit 1 ;;
          esac
          if [[ ! "${{ inputs.project }}" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Invalid project identifier"
            exit 1
          fi

      - name: Checkout Release Hub
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: main
          path: release-hub
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: assets

      - name: Validate planned version
        id: meta
