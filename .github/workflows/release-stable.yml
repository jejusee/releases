name: '[정식] Stable 배포'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rclone-manager-release
  cancel-in-progress: false

jobs:
  plan:
    uses: jejusee/releases/.github/workflows/plan.yml@main
    with:
      project: rclone-manager
      operation: release-stable
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  package:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate source
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(lib/install.sh bin/rclonectl.sh lib/common.sh lib/mount.sh lib/update.sh lib/uninstall.sh config/remote.env.example config/remote.filter.example systemd/rclone@.service)
          for file in "${required[@]}"; do [[ -f "$file" ]] || { echo "Missing: $file" >&2; exit 1; }; done
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find bin lib -type f -name '*.sh' -print0)
      - name: Build package
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -Eeuo pipefail
          PROJECT=rclone-manager
          PACKAGE="${PROJECT}-${VERSION}"
          BUILD_ROOT="$RUNNER_TEMP/build"
          PACKAGE_DIR="$BUILD_ROOT/$PACKAGE"
          mkdir -p "$PACKAGE_DIR"/{bin,lib,config,systemd} dist
          install -m 0755 lib/install.sh "$PACKAGE_DIR/lib/install.sh"
          install -m 0755 bin/rclonectl.sh "$PACKAGE_DIR/bin/rclonectl.sh"
          install -m 0644 lib/common.sh "$PACKAGE_DIR/lib/common.sh"
          install -m 0755 lib/mount.sh "$PACKAGE_DIR/lib/mount.sh"
          install -m 0755 lib/update.sh "$PACKAGE_DIR/lib/update.sh"
          install -m 0755 lib/uninstall.sh "$PACKAGE_DIR/lib/uninstall.sh"
          install -m 0644 config/remote.env.example "$PACKAGE_DIR/config/remote.env.example"
          install -m 0644 config/remote.filter.example "$PACKAGE_DIR/config/remote.filter.example"
          install -m 0644 systemd/rclone@.service "$PACKAGE_DIR/systemd/rclone@.service"
          [[ -f README.md ]] && install -m 0644 README.md "$PACKAGE_DIR/README.md"
          [[ -f LICENSE ]] && install -m 0644 LICENSE "$PACKAGE_DIR/LICENSE"
          printf '%s\n' "$VERSION" > "$PACKAGE_DIR/VERSION"
          tar -C "$BUILD_ROOT" -czf "dist/${PACKAGE}.tar.gz" "$PACKAGE"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, package]
    uses: jejusee/releases/.github/workflows/publish.yml@main
    with:
      project: rclone-manager
      operation: release-stable
      version: ${{ needs.plan.outputs.version }}
      artifact_name: release-package
      asset_spec: >-
        [{"platform":"any","file":"rclone-manager-${{ needs.plan.outputs.version }}.tar.gz","type":"archive","installer":"lib/install.sh"}]
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
